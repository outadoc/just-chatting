name: Release - Create tag

on:
  workflow_dispatch:
  schedule:
    - cron: "0 1 * * 1"

jobs:
  create-tag:
    name: Create release tag
    runs-on: ubuntu-latest
    environment: release

    concurrency:
      group: create-release
      cancel-in-progress: true

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true
          # Push the tag with a PAT: events created with the default GITHUB_TOKEN
          # don't trigger other workflows, and the tag needs to start the deploy workflow.
          token: ${{ secrets.RELEASE_GITHUB_TOKEN }}

      - name: Check if last commit is tagged
        id: check-tagged-commit
        continue-on-error: true
        run: |
          if [[ $(git tag --points-at HEAD) ]]; then
            echo "Last commit is tagged"
            echo "tagged=yes" >> $GITHUB_OUTPUT
          else
            echo "Last commit is not tagged"
            echo "tagged=no" >> $GITHUB_OUTPUT
          fi

      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y.%m')" >> $GITHUB_OUTPUT

      - name: Compute unique version code
        id: version
        run: echo "version=$(git rev-list HEAD --count)" >> $GITHUB_OUTPUT

      - name: Create and push tag
        # If latest commit is not tagged yet, tag it; this triggers the deploy workflow
        if: steps.check-tagged-commit.outputs.tagged == 'no'
        run: |
          git tag "v${{ steps.date.outputs.date }}.${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.date.outputs.date }}.${{ steps.version.outputs.version }}"
