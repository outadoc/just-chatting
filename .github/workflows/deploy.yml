name: Deploy apps

on:
  push:
    tags:
      - "v*"

jobs:
  deploy-ios:
    name: Deploy iOS app
    environment: deploy
    runs-on: macos-26

    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v5

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: false

      - name: Get current date
        id: date
        run: echo "::set-output name=date::$(date +'%Y.%m')"

      - name: Compute unique version code
        id: version
        run: echo "::set-output name=version::$(git rev-list HEAD --count)"

      - name: Set up Mise
        uses: jdx/mise-action@v3
        with:
          install: false

      - name: Install Mise dependencies
        run: mise install
        working-directory: app-ios

      - name: Generate Xcode project
        run: tuist generate
        working-directory: app-ios
        env:
          # CFBundleVersion is the commit count
          TUIST_VERSION_CODE: "${{ steps.version.outputs.version }}"
          # CFBundleShortVersionString is based on the date and commit count
          TUIST_VERSION_NAME: "${{ steps.date.outputs.date }}.${{ steps.version.outputs.version }}"

      - name: Setup Match repository credentials
        run: echo "${MATCH_DEPLOY_KEY}" | ssh-add -
        env:
          MATCH_DEPLOY_KEY: ${{ secrets.MATCH_DEPLOY_KEY }}

      - name: Build shared framework
        run: ./gradlew :shared-ui:linkReleaseFrameworkIosArm64

      - name: Download App Store Connect API key
        run: echo "$APPLE_DEV_PORTAL_API_KEY" > /tmp/appstore-api-key.p8
        env:
          APPLE_DEV_PORTAL_API_KEY: ${{ secrets.APPLE_DEV_PORTAL_API_KEY }}

      - name: Run Fastlane
        run: fastlane beta
        working-directory: app-ios
        env:
          MATCH_PASSWORD: ${{ secrets.FASTLANE_MATCH_PASSWORD }}

  deploy-desktop:
    name: Deploy desktop app (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    environment: deploy

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows-amd64
            gradle-task: packageMsi
            dist-dir: app-desktop/build/compose/binaries/main/msi
            ext: msi
          - os: macos-26
            label: macos-aarch64
            gradle-task: packageDmg
            dist-dir: app-desktop/build/compose/binaries/main/dmg
            ext: dmg
          - os: ubuntu-latest
            label: linux-amd64
            gradle-task: packageAppImage
            dist-dir: app-desktop/build/compose/binaries/main/AppImage
            ext: AppImage

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v5

      - name: Set up Nucleus build environment
        uses: NucleusFramework/Nucleus/.github/actions/setup-nucleus@main
        with:
          java-version: '21'

      - name: Get current date
        id: date
        run: echo "::set-output name=date::$(date +'%Y.%m')"
        shell: bash

      - name: Compute unique version code
        id: version
        run: echo "::set-output name=version::$(git rev-list HEAD --count)"
        shell: bash

      - name: Build package
        run: |
          ./gradlew app-desktop:${{ matrix.gradle-task }} "-PexternalVersionCode=${{ steps.version.outputs.version }}" "-PexternalVersionName=${{ steps.date.outputs.date }}.${{ steps.version.outputs.version }}" "-PenableLogging=false"
        shell: bash

      - name: Rename output
        shell: bash
        run: |
          mv ${{ matrix.dist-dir }}/*.${{ matrix.ext }} \
            "${{ matrix.dist-dir }}/JustChatting-${{ matrix.label }}-${{ steps.version.outputs.version }}.${{ matrix.ext }}"

      - name: Stage artifact for update metadata
        shell: bash
        run: |
          mkdir -p "artifacts/release-assets-${{ matrix.label }}"
          cp "${{ matrix.dist-dir }}/JustChatting-${{ matrix.label }}-${{ steps.version.outputs.version }}.${{ matrix.ext }}" \
            "artifacts/release-assets-${{ matrix.label }}/"

      - name: Install modern Bash (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew install bash
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"

      - name: Generate update metadata
        uses: NucleusFramework/Nucleus/.github/actions/generate-update-yml@main
        with:
          artifacts-path: artifacts
          version: "${{ steps.date.outputs.date }}.${{ steps.version.outputs.version }}"

      - name: Locate generated update metadata
        id: update-yml
        shell: bash
        run: echo "path=$(ls artifacts/update-yml/*.yml)" >> "$GITHUB_OUTPUT"

      - name: Upload packages to GitHub
        uses: actions/upload-artifact@v7.0.1
        with:
          path: |
            ${{ matrix.dist-dir }}/JustChatting-${{ matrix.label }}-${{ steps.version.outputs.version }}.${{ matrix.ext }}
            ${{ steps.update-yml.outputs.path }}
          name: build-${{ matrix.label }}

  deploy-android:
    name: Deploy Android app
    runs-on: ubuntu-latest
    environment: deploy

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v5

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: false

      - name: Get current date
        id: date
        run: echo "::set-output name=date::$(date +'%Y.%m')"

      - name: Compute unique version code
        id: version
        run: echo "::set-output name=version::$(git rev-list HEAD --count)"

      - name: Build app bundle
        run: |
          ./gradlew bundleRelease \
          "-PreleaseKeystorePassword=${{ secrets.RELEASE_KEYSTORE_PASSWORD }}" \
          "-PexternalVersionName=${{ steps.date.outputs.date }}.${{ steps.version.outputs.version }}" \
          "-PexternalVersionCode=${{ steps.version.outputs.version }}" \
          "-PenableLogging=false"

      - name: Upload app bundle to GitHub
        uses: actions/upload-artifact@v7.0.1
        with:
          name: apk
          path: app-android/build/outputs/bundle/release/app-android-release.aab

      - name: Publish nightly build to internal track
        uses: r0adkll/upload-google-play@v1
        with:
          track: internal
          status: completed
          packageName: fr.outadoc.justchatting
          releaseFiles: app-android/build/outputs/bundle/release/app-android-release.aab
          mappingFile: app-android/build/outputs/mapping/release/mapping.txt
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}

  publish-release:
    name: Publish release
    needs: [ deploy-ios, deploy-desktop, deploy-android ]
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          path: artifacts

      - name: Create release with artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          find artifacts -type f -print0 \
            | xargs -0 gh release create "$TAG" \
              --generate-notes \
              --title "$TAG" \
              --latest \
              --repo "$REPO"
