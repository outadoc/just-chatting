{%- comment -%}
  Chat bubbles float over other apps, which the screenshot tests can't capture, so this
  one is drawn. The colors are the demo channels' avatars.
{%- endcomment -%}
<div class="bubbles" role="img" aria-label="An open chat bubble, with two more chat bubbles next to it.">
  <div class="bubbles-heads">
    <span style="background: #e06437"></span>
    <span style="background: #2ea059"></span>
    <span style="background: #3b82c4"></span>
  </div>
  <div class="bubbles-chat">
    <div class="bubbles-chat-header"><span style="background: #e06437"></span><b>Solanum</b></div>
    <p><b class="chatter-pink">Pye</b> This is beyond extraordinary!</p>
    <p><b class="chatter-orange">Ramie</b> Hypothesis confirmed!</p>
    <div class="bubbles-chat-input">Send a message</div>
  </div>
</div>
